version: 2

updates:
  # One grouped PR a week rather than a dozen single-package ones: the whole
  # dependency set is verified together by CI anyway, and a single PR is the
  # only shape a solo maintainer actually reviews.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    groups:
      npm-dependencies:
        patterns:
          - '*'
    # eslint 10 is uninstallable: eslint-plugin-jsx-a11y 6.x (the latest
    # release) caps its peer at eslint ^9, and the grouped bump broke `npm ci`
    # with ERESOLVE. Re-allow v10 once jsx-a11y ships support for it.
    # Same for typescript 7: typescript-eslint 8.x caps at TS <6.1.
    ignore:
      - dependency-name: 'eslint'
        versions: ['>= 10']
      - dependency-name: '@eslint/js'
        versions: ['>= 10']
      - dependency-name: 'typescript'
        versions: ['>= 6']
    commit-message:
      prefix: deps

  # The workflows pin actions by major tag, so this only moves when an action
  # publishes a new major — rare, but silent breakage otherwise.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - '*'
    commit-message:
      prefix: ci
