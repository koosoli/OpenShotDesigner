name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR makes the in-flight run's answer obsolete, so cancel it
# rather than paying for a result nobody will read. Runs on main keep their
# own group per ref so a merge is never cancelled by a later PR push.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # jsdom 30 -> undici 8 needs Node >= 22 (webidl.util.markAsUncloneable).
          # Keep in sync with the local dev runtime.
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run lint
      - run: npm run build
      - run: npm run check:bundle
      - run: GH_PAGES=true npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:e2e:offline
